name: Update Lokalise snapshot

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lokalise-snapshot-main
  cancel-in-progress: false

jobs:
  update-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check whether today's snapshot already exists
        id: snapshot
        run: |
          snapshot_path="public/snapshots/$(date -u +%F)_Lokalise_projects.json"
          echo "path=$snapshot_path" >> "$GITHUB_OUTPUT"

          if [ -f "$snapshot_path" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot already exists for today; skipping fetch."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch snapshot from Lokalise
        if: steps.snapshot.outputs.skip != 'true'
        env:
          LOKALISE_API_TOKEN: ${{ secrets.LOKALISE_API_TOKEN }}
        run: npm run snapshot

      - name: Scrub snapshots and rebuild manifest
        run: npm run scrub

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit and push snapshot updates
        run: |
          if git diff --quiet -- public/snapshots; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/snapshots/*.json

          if git diff --cached --quiet; then
            echo "No staged snapshot changes to commit."
            exit 0
          fi

          git commit -m "chore: update Lokalise snapshot ($(date -u +%F))"
          git push origin HEAD:main
